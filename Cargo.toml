[package]
name = "pysegul"
version = "0.5.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html


[lib]
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.30.1", features = [
    "extension-module",
    "generate-import-lib",
] }
segul-core = { git = "https://github.com/hhandika/segul.git", branch = "main" }
serde = "1.0"
serde_json = "1.0"
